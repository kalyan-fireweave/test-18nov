packages:
  - apps/*
  - packages/*

dangerouslyAllowAllBuilds: true

allowBuilds:
  "@swc/core": true
  "@temporalio/core-bridge": true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@fireweaveai/server-sdk@3.1.1-rc.1'
  - '@fireweaveai/web-sdk@3.1.1-rc.1'
